name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/hermes-ts build
      - run: bun run --cwd packages/react-hermes build
      - run: bun run typecheck
      - run: bun test packages
      - run: bun run test:integration:local
      - run: bun scripts/check-snippets.ts
      - run: bun run --cwd apps/landing build:examples
