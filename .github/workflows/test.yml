name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The pinned toolchain from .bun-version, and the oldest Bun the
        # packages' engines field accepts.
        bun: [pinned, "1.3.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ${{ matrix.bun == 'pinned' && '.bun-version' || '' }}
          bun-version: ${{ matrix.bun != 'pinned' && matrix.bun || '' }}
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/hermes-ts build
      - run: bun run --cwd packages/react-hermes build
      - run: bun run typecheck
      - run: bun test packages
      - run: bun test scripts
      - run: bun run test:integration:local
      - run: bun scripts/check-snippets.ts
      - run: bun scripts/openapi.ts --check
      - run: bun scripts/check-versions.ts
      # Builds the website, the VitePress docs and the chat app it embeds.
      - run: bun run --cwd apps/landing build
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/hermes-ts build
      - run: bun run --cwd packages/react-hermes build
      - name: install the packed tarballs and run them under Bun and Node
        run: bun scripts/pack-smoke.ts
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hermes-remote:ci .
      - name: smoke test the image
        run: |
          docker run -d --name hr -p 8643:8643 hermes-remote:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8643/v1/status && break; sleep 1; done
          curl -fs http://127.0.0.1:8643/v1/status | grep '"ok":true'
          docker exec hr bun /app/bin/hermes-remote.js doctor || true
          docker rm -f hr
