name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  # npm provenance: the registry verifies this workflow built the tarball.
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: the tag matches the server version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./packages/hermes-api/package.json').version")"
      - run: bun run --cwd packages/hermes-ts build
      - run: bun run --cwd packages/react-hermes build
      - run: bun run typecheck
      - run: bun test packages
      - run: bun run test:integration:local
      - run: bun scripts/check-versions.ts
      - run: bun scripts/pack-smoke.ts
      - name: publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in hermes-ts react-hermes hermes-api cli; do
            name=$(node -p "require('./packages/$p/package.json').name")
            version=$(node -p "require('./packages/$p/package.json').version")
            # Re-running a tag skips versions already on npm; any other
            # publish failure fails the release.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              continue
            fi
            (cd packages/$p && npm publish --access public --provenance)
          done
      - name: pack tarballs
        run: |
          mkdir -p /tmp/packs
          for p in hermes-ts react-hermes hermes-api cli; do
            (cd packages/$p && npm pack --pack-destination /tmp/packs)
          done
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" /tmp/packs/*.tgz \
            --title "${GITHUB_REF_NAME}" --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" /tmp/packs/*.tgz --clobber
