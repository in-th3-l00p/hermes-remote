name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test packages
      - run: bun run --cwd packages/hermes-ts build
      - run: bun run --cwd packages/react-hermes build
      - name: publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          for p in hermes-ts react-hermes hermes-api cli; do
            (cd packages/$p
             if ! npm publish --access public 2>/tmp/publish-err.log; then
               cat /tmp/publish-err.log
               grep -qiE "cannot publish over|EPUBLISHCONFLICT|409|previously published" /tmp/publish-err.log || exit 1
             fi)
          done
      - name: pack tarballs
        run: |
          mkdir -p /tmp/packs
          for p in hermes-ts react-hermes hermes-api cli; do
            (cd packages/$p && npm pack --pack-destination /tmp/packs)
          done
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" /tmp/packs/*.tgz \
            --title "${GITHUB_REF_NAME}" --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" /tmp/packs/*.tgz --clobber
